services:

  mysql:
    image: mysql:8.0
    container_name: punto-venta-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: p01nts4l3
      MYSQL_DATABASE: pointsale_db
    ports:
      - "3306:3306"
    volumes:
      - pointsale_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: pointsale-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      - mysql

volumes:
  pointsale_mysql_data:
