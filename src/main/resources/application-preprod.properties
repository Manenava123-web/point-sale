###################################
# MYSQL / JPA
###################################
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=true&requireSSL=true&allowPublicKeyRetrieval=false&serverTimezone=America/Mexico_City&characterEncoding=UTF-8&useUnicode=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

###################################
# ENCODING
###################################
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.jpa.properties.hibernate.connection.characterEncoding=UTF-8
spring.jpa.properties.hibernate.connection.useUnicode=true

###################################
# SECURITY DEFAULT ADMIN
###################################
app.default.username=${APP_ADMIN_USER}
app.default.password=${APP_ADMIN_PASSWORD}
app.default.role=ADMIN
app.default.nombre=${APP_ADMIN_NOMBRE:Administrador}

###################################
# PDF
###################################
pos.pdf.output-path=${PDF_OUTPUT_PATH:./tickets/}

###################################
# LOGGING
###################################
logging.level.root=WARN
logging.level.mx.com.sale=INFO

###################################
# ACTUATOR
###################################
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

###################################
# SWAGGER
###################################
springdoc.swagger-ui.path=/swagger

###################################
# FILE UPLOAD
###################################
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
