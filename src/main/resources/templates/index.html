<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POS PRO</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link th:href="@{/css/dark.css}" rel="stylesheet">
<style>
  #app { padding: 1.5rem; min-height: 100vh; }
</style>
</head>
<body>

<aside id="sidebar">
  <div class="sidebar-brand">
    <span class="brand-icon">&#128179;</span>
    <div class="brand-text">
      <div class="brand-name">POS PRO</div>
      <div class="brand-sub">Punto de Venta</div>
    </div>
  </div>

  <nav class="sidebar-nav">
    <div class="sidebar-section">Menú</div>
    <button id="nav-dashboard" onclick="loadView('dashboard')" class="sidebar-item">
      <i class="bi bi-grid-1x2"></i><span>Inicio</span>
    </button>
    <button id="nav-pos"      onclick="loadView('pos')"      class="sidebar-item">
      <i class="bi bi-cart3"></i><span>Venta</span>
    </button>
    <button id="nav-products" onclick="loadView('products')" class="sidebar-item">
      <i class="bi bi-box-seam"></i><span>Productos</span>
    </button>
    <button id="nav-ventas"   onclick="loadView('ventas')"   class="sidebar-item">
      <i class="bi bi-receipt-cutoff"></i><span>Ventas</span>
    </button>
    <button id="nav-users"    onclick="loadView('users')"    class="sidebar-item">
      <i class="bi bi-people"></i><span>Usuarios</span>
    </button>
    <button id="nav-reports"  onclick="loadView('reports')"  class="sidebar-item">
      <i class="bi bi-bar-chart-line"></i><span>Reportes</span>
    </button>
  </nav>

  <div class="sidebar-footer">
    <div class="sidebar-user">
      <div class="sidebar-avatar"><i class="bi bi-person"></i></div>
      <div class="sidebar-user-info">
        <div class="user-name" id="nav-username">Usuario</div>
        <div class="user-role" id="nav-userrole"></div>
      </div>
    </div>
    <button onclick="logout()" class="sidebar-logout">
      <i class="bi bi-box-arrow-right"></i><span>Cerrar sesión</span>
    </button>
  </div>
</aside>

<div id="alert-area" class="alert-area"></div>
<div id="app"></div>

<!-- Modal de confirmación global -->
<div id="modal-confirm"
     style="display:none;position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.6);"
     onclick="if(event.target===this)_cerrarConfirm()">
  <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
              width:100%;max-width:360px;background:var(--surface);
              border:1px solid var(--border);border-radius:var(--radius);
              box-shadow:var(--shadow);padding:1.5rem;">
    <div style="display:flex;gap:.65rem;align-items:flex-start;margin-bottom:1rem;">
      <span id="confirm-icon" style="font-size:1.25rem;line-height:1.3;flex-shrink:0;"></span>
      <div>
        <p id="confirm-title" style="margin:0 0 .3rem;font-weight:600;font-size:.95rem;"></p>
        <p id="confirm-msg"   style="margin:0;font-size:.84rem;color:var(--text-muted);"></p>
      </div>
    </div>
    <div style="display:flex;gap:.5rem;justify-content:flex-end;">
      <button onclick="_cerrarConfirm()" class="btn btn-outline-secondary btn-sm">Cancelar</button>
      <button id="confirm-ok" class="btn btn-sm">Confirmar</button>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script th:src="@{/js/api.js}"></script>
<script th:src="@{/js/auth.js}"></script>
<script>
const NAV_VIEWS = ['dashboard','pos','products','ventas','users','reports'];
const viewLoaded = {};

function loadView(v) {
  NAV_VIEWS.forEach(n => {
    const btn = document.getElementById('nav-' + n);
    if (btn) btn.classList.toggle('active-nav', n === v);
    const panel = document.getElementById('view-' + n);
    if (panel) panel.style.display = 'none';
  });

  let panel = document.getElementById('view-' + v);
  if (!panel) {
    panel = document.createElement('div');
    panel.id = 'view-' + v;
    document.getElementById('app').appendChild(panel);
  }
  panel.style.display = 'block';

  if (!viewLoaded[v]) {
    viewLoaded[v] = true;
    $(panel).load('/views/' + v);
  }
}

function logout() { localStorage.clear(); window.location = "/login"; }

/* ── Confirmación global ── */
window.confirmar = function(titulo, mensaje, onOk, danger) {
  document.getElementById("confirm-title").textContent = titulo;
  document.getElementById("confirm-msg").textContent   = mensaje;
  document.getElementById("confirm-icon").innerHTML    = danger
      ? '<i class="bi bi-exclamation-triangle-fill" style="color:var(--danger);"></i>'
      : '<i class="bi bi-question-circle-fill"       style="color:var(--warning);"></i>';
  const ok = document.getElementById("confirm-ok");
  ok.className = "btn btn-sm " + (danger ? "btn-danger" : "btn-primary");
  ok.onclick   = function() { _cerrarConfirm(); onOk(); };
  document.getElementById("modal-confirm").style.display = "block";
};
function _cerrarConfirm() {
  document.getElementById("modal-confirm").style.display = "none";
}

/* Global toast helper for child views */
window.showToast = function(msg, type = 'success') {
  const icons = { success: 'bi-check-circle-fill', error: 'bi-x-circle-fill', warning: 'bi-exclamation-triangle-fill' };
  const icon  = icons[type] || icons.success;
  const area  = document.getElementById('alert-area');
  const div   = document.createElement('div');
  div.className = 'pos-alert pos-alert-' + type;
  div.innerHTML = '<i class="bi ' + icon + ' me-1"></i>' + msg;
  area.appendChild(div);
  setTimeout(() => {
    div.style.transition = 'opacity .35s';
    div.style.opacity    = '0';
    setTimeout(() => div.remove(), 370);
  }, 3000);
};

/* Aplicar restricciones de rol en la UI */
(function() {
    const role = localStorage.getItem("role") || "";

    function applyRoleUI(role) {
        if (role !== "ADMIN") {
            const usersBtn    = document.getElementById("nav-users");
            const productsBtn = document.getElementById("nav-products");
            const ventasBtn   = document.getElementById("nav-ventas");
            if (usersBtn)    usersBtn.style.display    = "none";
            if (productsBtn) productsBtn.style.display = "none";
            if (ventasBtn)   ventasBtn.style.display   = "none";
        }
    }

    /* Mostrar datos desde localStorage mientras llega la respuesta */
    const cachedNombre = localStorage.getItem("nombre") || localStorage.getItem("user") || "";
    const usernameEl   = document.getElementById("nav-username");
    const roleEl       = document.getElementById("nav-userrole");
    if (usernameEl && cachedNombre) usernameEl.textContent = cachedNombre;
    if (roleEl && role)             roleEl.textContent     = role;
    applyRoleUI(role);

    /* Refrescar desde la DB para asegurar nombre real actualizado */
    $.getJSON("/auth/me", function(res) {
        if (!res || !res.nombre) return;
        localStorage.setItem("nombre", res.nombre);
        localStorage.setItem("role",   res.role || role);
        if (usernameEl) usernameEl.textContent = res.nombre;
        if (roleEl)     roleEl.textContent     = res.role || role;
        applyRoleUI(res.role || role);
    });
})();

/* ── Confirmación con contraseña ── */
let _passConfirmCb = null;

window.pedirPassword = function(descripcion, onOk) {
    _passConfirmCb = onOk;
    const desc = document.getElementById("pass-confirm-desc");
    if (desc && descripcion) desc.textContent = descripcion;
    document.getElementById("pass-confirm-input").value = "";
    document.getElementById("pass-confirm-error").style.display = "none";
    document.getElementById("pass-confirm-ok").disabled = false;
    document.getElementById("modal-pass-confirm").style.display = "block";
    setTimeout(() => document.getElementById("pass-confirm-input").focus(), 80);
};

function _cerrarPassConfirm() {
    document.getElementById("modal-pass-confirm").style.display = "none";
    _passConfirmCb = null;
}

function _submitPassConfirm() {
    const password = document.getElementById("pass-confirm-input").value;
    if (!password) return;
    const btn = document.getElementById("pass-confirm-ok");
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Verificando…';

    apiPost("/auth/verify-password", { password }, function() {
        _cerrarPassConfirm();
        if (_passConfirmCb) { const cb = _passConfirmCb; _passConfirmCb = null; cb(); }
    }, function() {
        document.getElementById("pass-confirm-error").style.display = "block";
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-check2-circle me-1"></i>Confirmar';
        document.getElementById("pass-confirm-input").value = "";
        document.getElementById("pass-confirm-input").focus();
    });
}

loadView("dashboard");
</script>

<!-- Modal de confirmación con contraseña -->
<div id="modal-pass-confirm"
     style="display:none;position:fixed;inset:0;z-index:2100;background:rgba(0,0,0,.65);">
  <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
              width:100%;max-width:380px;background:var(--surface);
              border:1px solid var(--border);border-radius:var(--radius);
              box-shadow:var(--shadow);padding:1.75rem;">

    <div style="display:flex;align-items:center;gap:.6rem;margin-bottom:.5rem;">
      <i class="bi bi-shield-lock-fill" style="font-size:1.25rem;color:var(--danger);"></i>
      <span style="font-weight:700;font-size:1rem;">Confirmar cancelación</span>
    </div>
    <p id="pass-confirm-desc"
       style="font-size:.83rem;color:var(--text-muted);margin-bottom:1.2rem;padding-left:1.85rem;">
      Ingresa tu contraseña para cancelar la venta.
    </p>

    <div style="margin-bottom:.9rem;">
      <label style="font-size:.82rem;color:var(--text-muted);margin-bottom:.4rem;display:block;">
        Contraseña
      </label>
      <input id="pass-confirm-input" type="password" class="form-control"
             placeholder="••••••••"
             onkeydown="if(event.key==='Enter')_submitPassConfirm()"
             autocomplete="current-password">
    </div>

    <div id="pass-confirm-error"
         style="display:none;font-size:.8rem;color:var(--danger);
                margin-bottom:.9rem;padding:.45rem .7rem;
                background:rgba(239,68,68,.1);border-radius:var(--radius-sm);">
      <i class="bi bi-x-circle me-1"></i>Contraseña incorrecta
    </div>

    <div style="display:flex;gap:.5rem;justify-content:flex-end;">
      <button onclick="_cerrarPassConfirm()" class="btn btn-outline-secondary btn-sm">Cancelar</button>
      <button id="pass-confirm-ok" class="btn btn-danger btn-sm"
              onclick="_submitPassConfirm()">
        <i class="bi bi-check2-circle me-1"></i>Confirmar
      </button>
    </div>
  </div>
</div>

<!-- Modal de cobro en efectivo -->
<div id="modal-cobro"
     style="display:none;position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.65);">
  <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
              width:100%;max-width:420px;background:var(--surface);
              border:1px solid var(--border);border-radius:var(--radius);
              box-shadow:var(--shadow);padding:1.75rem;">

    <div style="display:flex;align-items:center;gap:.6rem;margin-bottom:1.25rem;">
      <i class="bi bi-cash-coin" style="font-size:1.3rem;color:var(--accent);"></i>
      <span style="font-weight:700;font-size:1rem;">Cobro en efectivo</span>
    </div>

    <div style="background:var(--surface-2);border-radius:var(--radius-sm);
                padding:.9rem 1rem;margin-bottom:1.25rem;text-align:center;">
      <div style="font-size:.75rem;color:var(--text-muted);margin-bottom:.2rem;">Total a cobrar</div>
      <div id="cobro-total" style="font-size:2rem;font-weight:700;color:var(--accent);letter-spacing:-.02em;">$0.00</div>
    </div>

    <div style="margin-bottom:1rem;">
      <label style="font-size:.82rem;color:var(--text-muted);margin-bottom:.4rem;display:block;">
        Monto recibido
      </label>
      <div class="input-group">
        <span class="input-group-text" style="font-weight:600;">$</span>
        <input id="cobro-input" type="number" min="0" step="0.01"
               class="form-control" style="font-size:1.1rem;font-weight:600;"
               placeholder="0.00" oninput="actualizarCambio()">
      </div>
    </div>

    <div style="display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1.25rem;">
      <span style="font-size:.72rem;color:var(--text-subtle);width:100%;margin-bottom:.1rem;">Billetes rápidos</span>
      <button class="btn btn-outline-secondary btn-sm" onclick="setBillete(20)"  style="font-size:.78rem;">$20</button>
      <button class="btn btn-outline-secondary btn-sm" onclick="setBillete(50)"  style="font-size:.78rem;">$50</button>
      <button class="btn btn-outline-secondary btn-sm" onclick="setBillete(100)" style="font-size:.78rem;">$100</button>
      <button class="btn btn-outline-secondary btn-sm" onclick="setBillete(200)" style="font-size:.78rem;">$200</button>
      <button class="btn btn-outline-secondary btn-sm" onclick="setBillete(500)" style="font-size:.78rem;">$500</button>
      <button class="btn btn-outline-secondary btn-sm" onclick="setBillete(1000)" style="font-size:.78rem;">$1,000</button>
    </div>

    <div id="cobro-cambio-wrap"
         style="border-radius:var(--radius-sm);padding:.65rem 1rem;
                margin-bottom:1.25rem;text-align:center;display:none;">
      <div style="font-size:.78rem;margin-bottom:.15rem;" id="cobro-cambio-label">Cambio</div>
      <div id="cobro-cambio" style="font-size:1.5rem;font-weight:700;"></div>
    </div>

    <div style="display:flex;gap:.5rem;justify-content:flex-end;">
      <button onclick="cerrarCobro()" class="btn btn-outline-secondary btn-sm">Cancelar</button>
      <button id="cobro-ok" class="btn btn-primary btn-sm" disabled
              onclick="confirmarCobro()">
        <i class="bi bi-check2-circle me-1"></i>Confirmar venta
      </button>
    </div>
  </div>
</div>
</body>
</html>
