<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POS PRO · Iniciar sesión</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/dark.css}">
</head>
<body>

<div class="login-page">
  <div class="card login-card">

    <div class="login-logo">&#128179;</div>
    <h1 class="login-title">POS PRO</h1>
    <p class="login-sub">Sistema de punto de venta</p>

    <div id="login-error" class="mb-3">
      <i class="bi bi-exclamation-circle me-1"></i>
      <span id="login-error-msg">Usuario o contraseña incorrectos</span>
    </div>

    <div class="mb-3">
      <label class="form-label" for="user">Usuario</label>
      <div class="input-icon-wrap">
        <i class="bi bi-person field-icon"></i>
        <input id="user" type="text" class="form-control" placeholder="Tu usuario"
               autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('pass').focus()">
      </div>
    </div>

    <div class="mb-4">
      <label class="form-label" for="pass">Contraseña</label>
      <div class="input-icon-wrap">
        <i class="bi bi-lock field-icon"></i>
        <input id="pass" type="password" class="form-control" placeholder="Tu contraseña"
               autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
        <button type="button" class="password-toggle" onclick="togglePass()" id="pass-toggle" aria-label="Ver contraseña">
          <i class="bi bi-eye" id="pass-icon"></i>
        </button>
      </div>
    </div>

    <button onclick="login()" class="btn btn-primary w-100" id="login-btn">
      <i class="bi bi-box-arrow-in-right"></i>
      Entrar
    </button>

  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script th:src="@{/js/api.js}"></script>
<script th:src="@{/js/auth.js}"></script>
<script>
function togglePass() {
  const inp  = document.getElementById('pass');
  const icon = document.getElementById('pass-icon');
  if (inp.type === 'password') {
    inp.type = 'text';
    icon.className = 'bi bi-eye-slash';
  } else {
    inp.type = 'password';
    icon.className = 'bi bi-eye';
  }
}

/* Wrap the original login to show error UI */
const _origLogin = typeof login !== 'undefined' ? login : null;
document.addEventListener('DOMContentLoaded', () => {
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-error');
  /* Expose helper so auth.js can call showLoginError(msg) */
  window.showLoginError = (msg) => {
    if (msg) document.getElementById('login-error-msg').textContent = msg;
    err.style.display = 'block';
    btn.disabled = false;
    btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Entrar';
  };
  window.setLoginLoading = (on) => {
    btn.disabled = on;
    btn.innerHTML = on
      ? '<span class="spinner-border spinner-border-sm me-1"></span>Entrando…'
      : '<i class="bi bi-box-arrow-in-right"></i> Entrar';
    err.style.display = 'none';
  };
});
</script>
</body>
</html>
