<div class="row g-3" style="max-width:960px;margin:0 auto;">

  <!-- Left: product input -->
  <div class="col-md-5">
    <div class="card h-100">
      <div class="card-header-custom">
        <div class="header-icon" style="background:rgba(35,134,54,.15);color:var(--accent);">
          <i class="bi bi-upc-scan"></i>
        </div>
        <h4>Nueva Venta</h4>
      </div>
      <div class="p-3">
        <label class="form-label" for="code">Código o nombre del producto</label>
        <div style="position:relative;">
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input id="code" type="text" class="form-control"
                   placeholder="Escanea, código o nombre…"
                   oninput="onPosInput(this.value)"
                   onkeydown="handlePosKey(event)"
                   autocomplete="new-password" autofocus>
            <button onclick="addProduct()" class="btn btn-primary" title="Agregar por código">
              <i class="bi bi-plus-lg"></i>
            </button>
          </div>
          <div id="pos-dropdown"
               style="display:none;position:absolute;top:100%;left:0;right:0;z-index:500;
                      background:var(--surface);border:1px solid var(--border);
                      border-top:none;border-radius:0 0 var(--radius) var(--radius);
                      box-shadow:var(--shadow);max-height:280px;overflow-y:auto;"></div>
        </div>
        <p class="text-subtle mt-2 mb-0" style="font-size:.78rem;">
          <i class="bi bi-keyboard me-1"></i>Presiona Enter para agregar
        </p>

        <div id="product-feedback" class="mt-3" style="display:none;"></div>

        <!-- Quick-add: last 3 recent items could go here; for now a hint -->
        <div class="mt-4 pt-3" style="border-top:1px solid var(--border-soft);">
          <p class="text-subtle mb-2" style="font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;">
            <i class="bi bi-clock-history me-1"></i>Estado del turno
          </p>
          <div class="d-flex gap-3">
            <div>
              <div class="text-subtle" style="font-size:.72rem;">Artículos</div>
              <div id="stat-items" style="font-size:1.1rem;font-weight:600;">0</div>
            </div>
            <div>
              <div class="text-subtle" style="font-size:.72rem;">Subtotal</div>
              <div id="stat-sub" style="font-size:1.1rem;font-weight:600;">$0.00</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Right: cart -->
  <div class="col-md-7">
    <div class="card h-100 d-flex flex-column">
      <div class="card-header-custom">
        <div class="header-icon" style="background:rgba(56,139,253,.15);color:var(--info);">
          <i class="bi bi-cart3"></i>
        </div>
        <h4>Carrito</h4>
        <button onclick="clearCart()" class="btn btn-outline-secondary btn-sm ms-auto"
                style="font-size:.75rem;" title="Vaciar carrito">
          <i class="bi bi-trash3"></i>
        </button>
      </div>

      <div class="flex-grow-1" style="overflow-y:auto;max-height:340px;">
        <div id="cart-empty" class="empty-cart">
          <div class="empty-icon"><i class="bi bi-cart-x"></i></div>
          <div style="font-size:.85rem;">Sin productos en el carrito</div>
        </div>
        <table class="table mb-0" id="cart-table" style="display:none;">
          <thead>
            <tr>
              <th>Producto</th>
              <th class="text-center" style="width:80px;">Cant.</th>
              <th class="text-end"  style="width:100px;">Subtotal</th>
              <th style="width:36px;"></th>
            </tr>
          </thead>
          <tbody id="cart"></tbody>
        </table>
      </div>

      <div class="p-3" style="border-top:1px solid var(--border-soft);">
        <div class="total-box mb-3">
          <div>
            <div class="total-label">Total a cobrar</div>
          </div>
          <div class="total-amount">$<span id="total">0.00</span></div>
        </div>
        <button onclick="checkout()" class="btn btn-primary w-100" id="checkout-btn" disabled
                style="padding:.6rem;font-size:.95rem;">
          <i class="bi bi-cash-coin me-1"></i> Cobrar y generar ticket
        </button>
      </div>
    </div>
  </div>

</div>

<script th:src="@{/js/pos.js}"></script>
